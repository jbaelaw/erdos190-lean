limitations:
  - >-
    No novelty is claimed for the formalization beyond the paper it formalizes; the mathematics
    is the paper's.  Only the qualitative statement is formalized; the explicit constant 1/e of
    the paper's main theorem is not.
  - >-
    The existence of H(k) for every k (Erdős–Graham, via Szemerédi's theorem) is not
    formalized.  divergence and divergence_eventually are statements about canonical N only
    and would hold vacuously if no canonical N existed; the conclusion about H(k) is
    formalized only in H_divergence, which takes existence as a hypothesis.
  - >-
    The compared theorems depend on propext, Classical.choice and Quot.sound, and, through the
    Solution only, on the pinned ProbMethodCombinatorics development.

acknowledgements: >-
  The symmetric Lovász local lemma is imported from the ProbMethodCombinatorics project
  (a Lean 4 formalization of Yufei Zhao's lecture notes "Probabilistic Methods in
  Combinatorics").
