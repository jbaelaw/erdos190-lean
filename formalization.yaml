fidelity:
  divergences: >-
    The formal statements are the qualitative statement of the paper (Corollary 1.2), phrased
    for every canonical N so as not to assume the existence of H(k); divergence alone does not
    entail a statement about H(k), and the conclusion H(k) > (Ck)^k for all large k is
    formalized only under the explicit existence hypothesis (H_divergence).  The paper's Proposition 4.1 uses
    r₀ = ⌊k/log k⌋ and gives the rate √k/log k; the formalization uses r₀ = ⌊k/3⌋, which
    avoids real analysis in the asymptotic step and gives the rate k^{1/6−o(1)}.  The
    Erdős–Lovász base is formalized with the cruder constant r^(k−1)/(16k²) (the paper has
    r^(k−1)/(16k)), obtained with the dependency-degree bound k²N in the local lemma; only the
    shape r^(k−1)/poly(k) matters.  [N] is modelled as Fin N (0-indexed), which does not affect
    any statement.  The paper's main theorem (the explicit constant 1/e and ε(k), via the
    Baker–Harman–Pintz prime-gap theorem) is not formalized.

sources:
  - title: "A resolution of Erdős Problem #190: the canonical van der Waerden number satisfies H(k)^{1/k}/k → ∞"
    authors: ["Ji Ho Bae"]
    type: "paper"
    id: "https://arxiv.org/abs/2604.20588"
    location: "Corollary 1.2 and Section 4.3 (Proposition 4.1); v2"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The paper whose qualitative statement this development formalizes.  The author of the
      paper is the author of the formalization.  Chronology, as documented in Section 1.2 of
      the paper (v2): the first version was posted on 22 April 2026 (arXiv:2604.20588v1,
      submission timestamp 2026-04-22 14:07:51 UTC); Fox and Hunter (arXiv:2606.02541, posted
      1 June 2026) describe it in their Section 1.1 as "very recent independent work" that
      "also resolves the problem", and prove the stronger bound H(k) ≥ k^{(1−o(1)) k log k}
      by a different method; the abstract of a seminar talk by Hunter (Stanford Combinatorics
      Seminar, 17 December 2025) announced "a quick resolution" of the problem but contains no
      proof, and Hunter's 2025 paper (Israel J. Math. 267; arXiv:2301.06212, the version the author
      checked) states no bound on H(k).  Within
      that record, the 22 April 2026 note is the earliest publicly available proof of
      H(k)^{1/k}/k → ∞ known to the author; the erdosproblems.com commentary (last edited
      2 June 2026) cites the note together with Fox–Hunter.  No claim is made beyond this
      documented chronology.

